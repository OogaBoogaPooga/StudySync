<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>StudySync</title>
    <meta name="description" content="StudySync — your collaborative study companion" />

    <!-- PWA -->
    <meta name="theme-color" content="#56768F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StudySync" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
      // Apply saved preferences before first paint to avoid a flash
      try {
        const t = JSON.parse(localStorage.getItem('studysync_theme') || '{}');
        if (t.dark ?? matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
        if (t.contrast) document.documentElement.classList.add('contrast');
        const theme = localStorage.getItem('studysync_theme_v2');
        if (theme && theme !== 'nordic') document.documentElement.setAttribute('data-theme', theme);
        const style = localStorage.getItem('studysync_ui_style');
        if (style && style !== 'nordic') document.documentElement.setAttribute('data-style', style);
        if (localStorage.getItem('studysync_reduce_motion') === '1') document.documentElement.classList.add('reduce-motion');
      } catch {}
    </script>
  </body>
</html>
